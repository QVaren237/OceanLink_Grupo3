<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OceanLink · Editar mi usuario</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="profile-edit-page">
<main class="profile-edit-main">
  <header class="topbar profile-edit-topbar">
    <div class="breadcrumb">OceanLink <strong>/</strong> Network Operator</div>
  </header>

  <section class="profile-edit-content">
    <div class="profile-edit-head">
      <div>
        <p class="eyebrow">CUENTA</p>
        <h1>Editar mi usuario</h1>
      </div>
    </div>

    <section class="profile-edit-card">
      <form action="#" class="profile-edit-form">
        <div class="profile-edit-left">
          <label class="field-label">Nombre completo
            <input type="text" value="Gerson García">
          </label>

          <label class="field-label">Correo electrónico
            <input type="email" value="g.garcia@oceanlink.pe">
          </label>

          <div class="field-label">Mi contraseña actual
            <div class="password-field">
              <input class="password-toggle" type="checkbox" id="show-current">
              <input class="password-input" type="password" value="12345678" aria-label="Mi contraseña actual">
              <label class="eye" for="show-current" aria-label="Mostrar u ocultar contraseña">
                <svg class="eye-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/><path d="m4 4 16 16"/></svg>
                <svg class="eye-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </label>
            </div>
          </div>

          <div class="field-label">Contraseña nueva
            <div class="password-field">
              <input class="password-toggle" type="checkbox" id="show-new">
              <input class="password-input" type="password" placeholder="Ingresa una nueva contraseña" aria-label="Ingresa una nueva contraseña">
              <label class="eye" for="show-new" aria-label="Mostrar u ocultar contraseña">
                <svg class="eye-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/><path d="m4 4 16 16"/></svg>
                <svg class="eye-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </label>
            </div>
          </div>

          <div class="field-label">Confirmar contraseña
            <div class="password-field">
              <input class="password-toggle" type="checkbox" id="show-confirm">
              <input class="password-input" type="password" placeholder="Repite la nueva contraseña" aria-label="Repite la nueva contraseña">
              <label class="eye" for="show-confirm" aria-label="Mostrar u ocultar contraseña">
                <svg class="eye-off" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/><path d="m4 4 16 16"/></svg>
                <svg class="eye-on" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </label>
            </div>
          </div>

          <label class="field-label">Cambio de rol
            <input type="text" value="Network Operator" disabled>
          </label>

          <div class="profile-edit-divider"></div>
          <div class="profile-edit-actions">
            <a class="btn ghost" href="infrastructure.html">Cancelar</a>
            <button class="btn primary" type="submit">Aceptar</button>
          </div>
        </div>

        <div class="profile-edit-image">
          <div class="profile-photo-placeholder"><div class="user-head"></div><div class="user-body"></div></div>
          <div class="profile-image-actions">
            <button class="btn primary" type="button">Editar imagen</button>
            <button class="btn ghost" type="button">Quitar</button>
          </div>
          <p>Foto de perfil del usuario. Formato JPG o<br>PNG, imagen cuadrada recomendada.</p>
        </div>
      </form>
    </section>
  </section>

  <footer class="footer profile-edit-footer"><span>OceanLink · Centro de operaciones</span></footer>
</main>
</body>
</html>
