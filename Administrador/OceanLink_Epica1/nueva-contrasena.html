<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva contraseña · OceanLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth"><div class="auth-card"><div class="brand brand-auth"><img class="brand-img" src="assets/logo.png" alt="Ocean Link Logistics"></div><h1>Crear nueva contraseña</h1><p class="sub">Escribe tu nueva contraseña dos veces para confirmarla.</p><div class="field"><label>Nueva contraseña</label><div class="pass-wrap"><input class="input" id="rs-p1" type="password" placeholder="••••••••"><button class="eye" type="button" onclick="tp('rs-p1',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="hint">Mínimo 8 caracteres.</div></div><div class="field"><label>Repetir contraseña</label><div class="pass-wrap"><input class="input" id="rs-p2" type="password" placeholder="••••••••"><button class="eye" type="button" onclick="tp('rs-p2',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><a class="btn btn-primary" style="width:100%;justify-content:center" href="contrasena-actualizada.html">Guardar contraseña</a></div></div><script>
var EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.2 6.7A17 17 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4-.8"/><path d="M9.5 9.6a3 3 0 0 0 4.2 4.2"/></svg>';
function tp(id,b){var i=document.getElementById(id);var s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE;}
</script>
</body>
</html>
