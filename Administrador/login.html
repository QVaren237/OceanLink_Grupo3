<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · OceanLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth"><div class="auth-card"><div class="brand brand-auth"><img class="brand-img" src="assets/logo.png" alt="Ocean Link Logistics"></div><h1>Iniciar sesión</h1><p class="sub">Ingresa con tu cuenta para acceder a los módulos de tu rol.</p><div class="field"><label>Correo electrónico</label><input class="input" placeholder="correo@oceanlink.pe" value="a.angles@oceanlink.pe"></div><div class="field"><label>Contraseña</label><div class="pass-wrap"><input class="input" id="li-pass" type="password" placeholder="••••••••"><button class="eye" type="button" onclick="tp('li-pass',this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="row-between"><span></span><a class="link" href="recuperar.html">¿Olvidaste tu contraseña?</a></div><a class="btn btn-primary" style="width:100%;justify-content:center" href="panel.html">Iniciar sesión</a><p class="foot-note">El acceso y los módulos visibles dependen del rol asignado por el administrador.</p></div></div><script>
var EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.2 6.7A17 17 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4-.8"/><path d="M9.5 9.6a3 3 0 0 0 4.2 4.2"/></svg>';
function tp(id,b){var i=document.getElementById(id);var s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE;}
</script>
</body>
</html>
